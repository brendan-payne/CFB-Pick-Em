services:
  - type: web
    name: core10-2026cfbpickem
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PIN
        sync: false
      - key: CRON_SECRET
        generateValue: true
